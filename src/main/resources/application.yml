spring:
  application:
    name: alumni-intelligence-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/alumnidb}
    username: ${DB_USERNAME:alumni_user}
    password: ${DB_PASSWORD:alumni_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  mvc:
    throw-exception-if-no-handler-found: true

  web:
    resources:
      add-mappings: false

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

phantombuster:
  api-key: ${PHANTOMBUSTER_API_KEY:}
  agent-id: ${PHANTOMBUSTER_AGENT_ID:}
  linkedin-session-cookie: ${LINKEDIN_SESSION_COOKIE:}
  base-url: https://api.phantombuster.com/api/v2
  connect-timeout-ms: 10000
  read-timeout-ms: 60000
  poll-interval-ms: 5000
  max-poll-attempts: 60

async:
  core-pool-size: 5
  max-pool-size: 20
  queue-capacity: 100
  thread-name-prefix: alumni-async-

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

logging:
  level:
    com.alumniintelligence: INFO
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
