spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/alumnidb}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:alumni_user}
    password: ${DB_PASSWORD:alumni_pass}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

phantombuster:
  api-key: test-api-key
  agent-id: test-agent-id
  linkedin-session-cookie: test-cookie
  base-url: http://localhost:9999
  connect-timeout-ms: 3000
  read-timeout-ms: 5000

logging:
  level:
    com.alumniintelligence: DEBUG
